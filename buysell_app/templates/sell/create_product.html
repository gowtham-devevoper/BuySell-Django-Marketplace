{% extends 'main.html' %}
{% block content %}

<div class="container py-5">

  <h2>Post Product</h2>
  
  <h5>Category :
    {{ subcategory.category.name }}
  </h5>

  <h5>
    SubCategory :
    {{ subcategory.name }}
  </h5>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Post Product</button>
  </form>
</div>

{% endblock %}
