{% extends 'main.html' %}
{% block content %}

<div class="otp-wrapper">

  <div class="container">

    <div class="row justify-content-center">

      <div class="col-lg-5 col-md-7 col-sm-10">

        <div class="otp-card">

          <h2>
            OTP Verification
          </h2>

          <p class="otp-subtitle">
            Enter the OTP sent to your email address
          </p>

          <form method="POST">

            {% csrf_token %}

            <input type="text" name="otp" class="otp-input" placeholder="Enter 6 Digit OTP" maxlength="6" required>

            <button type="submit" class="verify-btn">

              Verify OTP

            </button>

          </form>

          <div id="timer" class="otp-timer">

            OTP expires in : 05:00

          </div>

          {% for message in messages %}

          <div class="alert alert-danger mt-3">

            {{message}}

          </div>

          {% endfor %}

          <div class="resend-text">

            Didn't receive OTP?

            <a href="{% url 'resend_otp' %}">
              Resend OTP
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<style>
  /* Background */

  body {
    background: #f8f9fa;
  }

  /* Full Page Center */

  .otp-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Card */

  .otp-card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
  }

  /* Heading */

  .otp-card h2 {
    color: #198754;
    font-weight: 700;
    margin-bottom: 10px;
  }

  /* Subtitle */

  .otp-subtitle {
    color: #777;
    margin-bottom: 25px;
  }

  /* Input */

  .otp-input {
    width: 100%;
    height: 55px;
    border: 2px solid #e5e5e5;
    border-radius: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 4px;
    outline: none;
    transition: .3s;
  }

  .otp-input:focus {
    border-color: #198754;
    box-shadow: 0 0 0 4px rgba(25, 135, 84, .12);
  }

  /* Button */

  .verify-btn {
    width: 100%;
    height: 52px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: #198754;
    color: white;
    font-size: 16px;
    font-weight: 600;
    transition: .3s;
  }

  .verify-btn:hover {
    background: #146c43;
  }

  /* Timer */

  .otp-timer {
    margin-top: 20px;
    font-weight: 600;
    color: #dc3545;
    font-size: 15px;
  }

  /* Resend */

  .resend-text {
    margin-top: 20px;
    font-size: 14px;
    color: #666;
  }

  .resend-text a {
    text-decoration: none;
    color: #198754;
    font-weight: 600;
  }

  /* Mobile */

  @media(max-width:768px) {

    .otp-card {
      padding: 30px 20px;
    }

    .otp-icon {
      font-size: 50px;
    }

    .otp-card h2 {
      font-size: 28px;
    }

  }

  @media(max-width:480px) {

    .otp-card {
      padding: 25px 15px;
      border-radius: 15px;
    }

    .otp-card h2 {
      font-size: 24px;
    }

    .otp-input {
      height: 50px;
      font-size: 18px;
      letter-spacing: 3px;
    }

    .verify-btn {
      height: 48px;
      font-size: 15px;
    }

  }
</style>

<script>
  

  let time = 300;

  let timer = document.getElementById(
    'timer'
  );

  let countdown = setInterval(() => {

    time--;

    let minutes = Math.floor(
      time / 60
    );

    let seconds = time % 60;

    timer.innerHTML =
      "OTP expires in : " +
      minutes +
      ":" +
      String(seconds).padStart(2,'0');

    if(time <= 0){

      clearInterval(
        countdown
      );

      timer.innerHTML =
        "OTP Expired";

    }

  },1000);

</script>


{% endblock %}
